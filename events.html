<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events — FALCON</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23000'/%3E%3Ccircle cx='32' cy='32' r='30' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Ctext x='32' y='44' font-family='serif' font-size='36' font-weight='bold' fill='%23fff' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Anurati';
  src: url('https://cdn.jsdelivr.net/gh/kaberikram/anurati@main/font/Anurati.otf') format('opentype');
  font-display: swap;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --black: #000;
  --white: #fff;
  --gray: #888;
  --border: rgba(255,255,255,0.08);
  --logo: 'Anurati', sans-serif;
  --display: 'Syne', sans-serif;
  --mono: 'Space Mono', monospace;
}

html, body {
  width: 100%; height: 100%;
  background: var(--black);
  color: var(--white);
  overflow-x: hidden;
  cursor: none;
}

/* CURSOR */
.cursor {
  position: fixed; top: 0; left: 0; z-index: 9999;
  width: 10px; height: 10px;
  background: var(--white);
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%,-50%);
  transition: width 0.2s, height 0.2s;
  mix-blend-mode: difference;
}
.cursor.expand { width: 40px; height: 40px; }

/* NOISE */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 900;
  pointer-events: none;
  opacity: 0.035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
}

/* NAV */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 500;
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.6rem 3rem;
  border-bottom: 1px solid var(--border);
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(16px);
}
.nav-logo {
  font-family: var(--logo);
  font-size: 1.4rem;
  letter-spacing: 0.18em;
  color: var(--white);
  text-decoration: none;
}
.nav-back {
  font-family: var(--mono);
  font-size: 0.65rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gray);
  text-decoration: none;
  display: flex; align-items: center; gap: 0.5rem;
  transition: color 0.2s;
}
.nav-back:hover { color: var(--white); }

/* MAIN STAGE */
.stage {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  padding: 6rem 2rem 4rem;
}

/* Moving grid */
.grid {
  position: absolute; inset: 0; z-index: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 80px 80px;
  animation: gridMove 25s linear infinite;
}
@keyframes gridMove {
  from { background-position: 0 0; }
  to   { background-position: 80px 80px; }
}

/* Gradient orb behind title */
.orb {
  position: absolute;
  width: 900px; height: 500px;
  border-radius: 50%;
  background: radial-gradient(ellipse at center,
    rgba(255,255,255,0.07) 0%,
    rgba(255,255,255,0.02) 40%,
    transparent 70%);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  animation: orbPulse 6s ease-in-out infinite alternate;
  pointer-events: none;
}
@keyframes orbPulse {
  from { transform: translate(-50%,-50%) scale(0.95); opacity: 0.7; }
  to   { transform: translate(-50%,-50%) scale(1.05); opacity: 1; }
}

/* Diagonal accent lines */
.dline {
  position: absolute;
  width: 1px;
  height: 150%;
  background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.06), transparent);
  top: -25%;
  animation: dlineSlide 5s ease-in-out infinite alternate;
}
.dline:nth-child(1) { left: 15%; transform: rotate(8deg); animation-delay: 0s; }
.dline:nth-child(2) { left: 35%; transform: rotate(8deg); animation-delay: 1s; opacity: 0.5; }
.dline:nth-child(3) { right: 15%; transform: rotate(-8deg); animation-delay: 0.5s; }
.dline:nth-child(4) { right: 35%; transform: rotate(-8deg); animation-delay: 1.5s; opacity: 0.5; }
@keyframes dlineSlide {
  from { transform: rotate(8deg) translateY(-4%); }
  to   { transform: rotate(8deg) translateY(4%); }
}

/* Content */
.content {
  position: relative; z-index: 2;
  text-align: center;
  display: flex; flex-direction: column; align-items: center;
}

/* FalconCon 26 title */
.event-eyebrow {
  font-family: var(--mono);
  font-size: 0.65rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--gray);
  margin-bottom: 3rem;
  display: flex; align-items: center; gap: 1.2rem;
  animation: fadeUp 1s 0.2s both;
}
.event-eyebrow::before, .event-eyebrow::after {
  content: '';
  width: 48px; height: 1px;
  background: var(--gray);
  display: block;
}

.event-title {
  font-family: var(--logo);
  font-size: clamp(3.5rem, 12vw, 10rem);
  letter-spacing: 0.1em;
  line-height: 1;
  background: linear-gradient(135deg,
    #ffffff 0%,
    #aaaaaa 30%,
    #ffffff 50%,
    #666666 70%,
    #ffffff 100%);
  background-size: 200% 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: fadeUp 1s 0.1s both, shimmer 6s ease-in-out infinite;
  display: block;
}
@keyframes shimmer {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.event-year {
  font-family: var(--logo);
  font-size: clamp(3.5rem, 12vw, 10rem);
  letter-spacing: 0.1em;
  line-height: 1;
  color: transparent;
  -webkit-text-stroke: 1px rgba(255,255,255,0.25);
  display: block;
  animation: fadeUp 1s 0.2s both;
}

/* Divider */
.divider {
  width: 1px;
  height: 60px;
  background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.3), transparent);
  margin: 3rem 0;
  animation: fadeUp 1s 0.4s both;
}

/* Coming Soon */
.coming-soon {
  font-family: var(--display);
  font-size: clamp(0.7rem, 3vw, 1.1rem);
  font-weight: 800;
  letter-spacing: clamp(0.3em, 3vw, 1.2em);
  text-transform: uppercase;
  color: transparent;
  -webkit-text-stroke: 1px rgba(255,255,255,0.5);
  animation: fadeUp 1s 0.5s both, comingSoonPulse 3s ease-in-out infinite;
}
@keyframes comingSoonPulse {
  0%, 100% { -webkit-text-stroke: 1px rgba(255,255,255,0.4); }
  50%       { -webkit-text-stroke: 1px rgba(255,255,255,0.9); }
}

/* Countdown placeholder */
.countdown-row {
  display: flex; gap: 0; margin-top: 4rem;
  border: 1px solid var(--border);
  animation: fadeUp 1s 0.7s both;
}
.countdown-item {
  padding: 1.5rem 2.5rem;
  border-right: 1px solid var(--border);
  text-align: center;
}
.countdown-item:last-child { border-right: none; }
.countdown-num {
  font-family: var(--logo);
  font-size: 2.2rem;
  letter-spacing: 0.08em;
  display: block;
  background: linear-gradient(180deg, #fff 0%, #666 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.countdown-label {
  font-family: var(--mono);
  font-size: 0.55rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gray);
  margin-top: 0.4rem;
  display: block;
}

/* Notify strip */
.notify-strip {
  margin-top: 4rem;
  display: flex; gap: 0;
  border: 1px solid var(--border);
  animation: fadeUp 1s 0.85s both;
  max-width: 480px; width: 100%;
}
.notify-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  padding: 1rem 1.4rem;
  font-family: var(--mono);
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  color: var(--white);
}
.notify-input::placeholder { color: var(--gray); }
.notify-btn {
  padding: 1rem 1.6rem;
  background: var(--white);
  color: var(--black);
  border: none;
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 700;
  cursor: none;
  transition: background 0.2s;
  white-space: nowrap;
}
.notify-btn:hover { background: #ccc; }

/* Back link */
.back-link {
  margin-top: 4rem;
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gray);
  text-decoration: none;
  display: flex; align-items: center; gap: 0.5rem;
  transition: color 0.2s;
  animation: fadeUp 1s 1s both;
}
.back-link:hover { color: var(--white); }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: none; }
}

/* Scanning line effect */
.scanline {
  position: absolute;
  left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
  animation: scan 8s linear infinite;
  pointer-events: none;
  z-index: 1;
}
@keyframes scan {
  from { top: -1px; }
  to   { top: 100%; }
}

@media (max-width: 700px) {
  nav { padding: 1.2rem 1.5rem; }
  .countdown-item { padding: 1.2rem 1.5rem; }
  .cursor { display: none; }
  body { cursor: auto; }
  .notify-btn { cursor: pointer; }
}
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>

<nav>
  <a class="nav-logo" href="index.html">FALCON</a>
  <a class="nav-back" href="index.html">&#8592; Back to Home</a>
</nav>

<div class="stage">
  <div class="grid"></div>
  <div class="orb"></div>
  <div class="dline"></div>
  <div class="dline"></div>
  <div class="dline"></div>
  <div class="dline"></div>
  <div class="scanline"></div>

  <div class="content">
    <p class="event-eyebrow">Falcon Events</p>

    <span class="event-title">FALCONCON</span>
    <span class="event-year">26</span>

    <div class="divider"></div>

    <p class="coming-soon">Coming &nbsp; Soon</p>

    <div class="countdown-row" id="countdown">
      <div class="countdown-item">
        <span class="countdown-num" id="cd-days">--</span>
        <span class="countdown-label">Days</span>
      </div>
      <div class="countdown-item">
        <span class="countdown-num" id="cd-hours">--</span>
        <span class="countdown-label">Hours</span>
      </div>
      <div class="countdown-item">
        <span class="countdown-num" id="cd-mins">--</span>
        <span class="countdown-label">Minutes</span>
      </div>
      <div class="countdown-item">
        <span class="countdown-num" id="cd-secs">--</span>
        <span class="countdown-label">Seconds</span>
      </div>
    </div>

    <div class="notify-strip">
      <input class="notify-input" type="email" id="notify-email" placeholder="Enter your email for updates...">
      <button class="notify-btn" id="notify-btn">Notify Me</button>
    </div>

    <a class="back-link" href="index.html">&#8592; Return to Falcon</a>
  </div>
</div>

<script>
// Cursor
const cursor = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  cursor.style.left = e.clientX + 'px';
  cursor.style.top = e.clientY + 'px';
});
document.querySelectorAll('a, button, input').forEach(el => {
  el.addEventListener('mouseenter', () => cursor.classList.add('expand'));
  el.addEventListener('mouseleave', () => cursor.classList.remove('expand'));
});

// Countdown to Jan 1 2026
const target = new Date('2026-12-31T00:00:00');
function tick() {
  const now = new Date();
  const diff = target - now;
  if (diff <= 0) {
    document.getElementById('cd-days').textContent = '00';
    document.getElementById('cd-hours').textContent = '00';
    document.getElementById('cd-mins').textContent = '00';
    document.getElementById('cd-secs').textContent = '00';
    return;
  }
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  document.getElementById('cd-days').textContent  = String(d).padStart(2,'0');
  document.getElementById('cd-hours').textContent = String(h).padStart(2,'0');
  document.getElementById('cd-mins').textContent  = String(m).padStart(2,'0');
  document.getElementById('cd-secs').textContent  = String(s).padStart(2,'0');
}
tick();
setInterval(tick, 1000);

// Notify
document.getElementById('notify-btn').addEventListener('click', function() {
  const email = document.getElementById('notify-email').value.trim();
  if (!email || !email.includes('@')) { alert('Please enter a valid email.'); return; }
  const subject = encodeURIComponent('FalconCon 26 — Notify Me');
  const body = encodeURIComponent('Please add me to the FalconCon 26 notify list.\n\nEmail: ' + email);
  window.location.href = 'mailto:falcon.incoroporated@gmail.com?subject=' + subject + '&body=' + body;
  this.textContent = '✓ Done!';
  this.style.background = '#000';
  this.style.color = '#fff';
  this.style.border = '1px solid #fff';
});
</script>
</body>
</html>
